services:
  - type: web
    name: windscope-india-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        value: sqlite:///./windscope_india.db
      - key: TIMEZONE_IST
        value: Asia/Kolkata
      - key: MARKET_TIMEZONE
        value: Asia/Kolkata
      - key: CORS_ORIGINS
        value: "https://windscopeindia.vercel.app,https://windscope-india.vercel.app,http://localhost:5173,http://localhost:3000,*"
