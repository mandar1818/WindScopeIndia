version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windscope_india_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./windscope_india.db
      - TIMEZONE_IST=Asia/Kolkata
      - MARKET_TIMEZONE=Asia/Kolkata
      - DEBUG=false
    volumes:
      - ./backend/windscope_india.db:/app/windscope_india.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - windscope-india-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windscope_india_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - windscope-india-network

networks:
  windscope-india-network:
    name: windscope_india_net
